name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Node 20 (Capacitor 7)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Java (OBLIGATORIO para Gradle)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4️⃣ Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5️⃣ Instalar Quasar
      - name: Install Quasar CLI
        run: npm install -g @quasar/cli

        # Capacitor CLI
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli


      # 6️⃣ Dependencias
      - name: Install dependencies
        run: npm install

      # 7️⃣ Build Quasar + Capacitor
      - name: Build Quasar Web
        run: quasar build

      - name: Sync Capacitor
        run: npx cap sync android


      # 8️⃣ Permisos gradlew
      - name: Fix gradlew permissions
        run: chmod +x src-capacitor/android/gradlew

      # 9️⃣ Compilar APK
      - name: Build APK Release
        run: |
          cd src-capacitor/android
          ./gradlew assembleRelease --no-daemon

      # 🔟 Subir APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youpass-apk
          path: src-capacitor/android/app/build/outputs/apk/release/*.apk
